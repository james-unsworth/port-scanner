   [build-system]
   requires = ["setuptools>=61"]
   build-backend = "setuptools.build_meta"

   [project]
   name = "portscan"
   version = "0.1.0"
   requires-python = ">=3.10"
   dependencies = ["libpcap==1.11.0b29"]

   [project.scripts]
   portscan = "main:main"

   [tool.setuptools]
   py-modules = ["main", "header"]
   packages = ["scan"]
